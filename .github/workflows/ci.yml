name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Self-check
        run: swift run focus-check
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != Info.plist v$version"; exit 1; }
      - name: Build app
        run: scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent dist/FocusGuard.app dist/FocusGuard.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FocusGuard
          path: dist/FocusGuard.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: FocusGuard
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum FocusGuard.zip | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" FocusGuard.zip --repo "$GITHUB_REPOSITORY" --generate-notes \
            --notes "SHA-256 of FocusGuard.zip: \`$sha\` (check it with \`shasum -a 256 FocusGuard.zip\`)"
